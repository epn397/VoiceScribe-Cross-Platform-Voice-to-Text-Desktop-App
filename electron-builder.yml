appId: com.voicescribe.app
productName: VoiceScribe
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: assets/icon.png
linux:
  target: AppImage
  icon: assets/icon.png
