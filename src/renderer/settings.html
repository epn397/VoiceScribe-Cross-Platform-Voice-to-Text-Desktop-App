<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Settings</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <style>
    body { padding: 20px; display: block; }
    .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
    h2 { margin-bottom: 16px; }
  </style>
</head>
<body data-theme="dark">
  <h2>⚙️ Settings</h2>
  <div class="field"><label>Speech API Provider</label>
    <select id="provider">
      <option value="azure">Azure Speech Service</option>
      <option value="google">Google Speech-to-Text</option>
      <option value="whisper">OpenAI Whisper</option>
    </select></div>
  <div class="field"><label>API Key</label><input id="apiKey" type="password" placeholder="Paste your key" /></div>
  <div class="field"><label>Azure Region (Azure only)</label><input id="region" placeholder="e.g. eastus" /></div>
  <div class="field"><label>Recognition Language</label>
    <select id="language"><option value="en-US">English (US)</option><option value="bn-BD">Bangla</option></select></div>
  <div class="field"><label>Font Size</label><input id="fontSize" type="number" min="10" max="40" /></div>
  <div class="field"><label>Theme</label><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
  <div class="field"><label>Global Hotkey</label><input id="globalHotkey" placeholder="CommandOrControl+Shift+R" /></div>
  <div class="field row"><input id="autoSave" type="checkbox" /><label for="autoSave">Auto-save transcripts</label></div>
  <div class="field row"><input id="autoCopy" type="checkbox" /><label for="autoCopy">Auto-copy to clipboard</label></div>
  <div class="field row"><input id="autoPunctuation" type="checkbox" /><label for="autoPunctuation">Automatic punctuation & capitalization</label></div>
  <div class="field row"><input id="minimizeToTray" type="checkbox" /><label for="minimizeToTray">Minimize to system tray</label></div>
  <div class="field"><label>Output Folder (auto-save)</label>
    <div class="row"><input id="outputFolder" readonly /><button id="pickFolder" class="btn ghost small">Browse</button></div></div>
  <div class="row"><button id="save" class="btn primary">Save</button><button id="cancel" class="btn ghost">Close</button></div>
  <script src="js/settings-ui.js"></script>
</body>
</html>
