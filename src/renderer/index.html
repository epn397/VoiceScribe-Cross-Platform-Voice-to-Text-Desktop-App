<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https: wss:;" />
  <title>VoiceScribe</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="brand"><span class="logo">🎙️</span> VoiceScribe</div>
    <div class="status-group">
      <span id="connStatus" class="badge offline">● Connecting…</span>
      <span id="recIndicator" class="rec-dot hidden"></span>
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌓</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </div>
  </header>

  <main class="workspace">
    <section class="controls">
      <button id="micBtn" class="mic-button" title="Start/Stop">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="currentColor">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12z"/>
        </svg>
      </button>
      <div class="btn-row">
        <button id="startBtn" class="btn primary">▶ Start</button>
        <button id="stopBtn" class="btn danger" disabled>■ Stop</button>
      </div>
      <div class="lang-select">
        <label>Language</label>
        <select id="langSelect">
          <option value="en-US">English (US)</option>
          <option value="bn-BD">Bangla (বাংলা)</option>
        </select>
      </div>
      <div class="toolbar">
        <button id="copyBtn" class="btn ghost">📋 Copy</button>
        <button id="clearBtn" class="btn ghost">🗑 Clear</button>
        <button id="saveBtn" class="btn ghost">💾 TXT</button>
        <button id="docxBtn" class="btn ghost">📄 DOCX</button>
        <button id="pdfBtn" class="btn ghost">📕 PDF</button>
        <button id="zoomOut" class="btn ghost">A−</button>
        <button id="zoomIn" class="btn ghost">A+</button>
      </div>
      <div class="search-row">
        <input id="searchInput" placeholder="Find…" />
        <input id="replaceInput" placeholder="Replace…" />
        <button id="replaceBtn" class="btn ghost small">Replace</button>
      </div>
    </section>

    <section class="editor-wrap">
      <textarea id="transcript" spellcheck="false"
        placeholder="Press Start and begin speaking…"></textarea>
      <div id="interim" class="interim"></div>
      <div class="meta">
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Characters: 0</span>
        <span class="hint">Shortcuts: Ctrl+R record · Ctrl+S save · Ctrl+Z undo</span>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="historyPanel" class="history hidden"></div>

  <script src="js/exporters.js"></script>
  <script src="js/history.js"></script>
  <script src="js/providers/azure.js"></script>
  <script src="js/providers/google.js"></script>
  <script src="js/providers/whisper.js"></script>
  <script src="js/stt-engine.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
